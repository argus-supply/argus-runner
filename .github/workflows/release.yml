name: Prepare release

on:
  push:
    tags: ['runner-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          version="${GITHUB_REF_NAME#runner-v}"
          test -f "release-inputs/runner-v${version}.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "release-inputs/runner-v${version}.json")" = "$version"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "ARGUS Runner $version" --notes "Draft created from the immutable Runner input record. The ARGUS source authority packages and uploads both Linux targets before publication."
        env:
          GH_TOKEN: ${{ github.token }}
